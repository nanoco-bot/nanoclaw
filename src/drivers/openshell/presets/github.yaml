# Egress preset: GitHub over HTTPS for the agent image's git and node/bun.
# Rules use the EgressRule shape (src/drivers/openshell/policy.ts): name, host,
# ports, binaries. Bump `version` on ANY rule change; the policy change log
# records name + version for every rule a preset applies.
name: github
version: 1
description: GitHub over HTTPS — git clone/fetch/push and the REST/GraphQL API, from git, node and bun only.
rules:
  - name: github_git
    host: github.com
    ports: [443]
    # OpenShell matches a binary or any of its ancestors, so git's
    # git-remote-https helper is covered by /usr/bin/git.
    binaries: [/usr/bin/git]
  - name: github_api
    host: api.github.com
    ports: [443]
    binaries: [/usr/local/bin/node, /usr/local/bin/bun]
  - name: github_raw
    host: raw.githubusercontent.com
    ports: [443]
    binaries: [/usr/local/bin/node, /usr/local/bin/bun]
