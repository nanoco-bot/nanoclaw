# Egress preset: a hosted CRM API (HubSpot) for node/bun tools in the agent.
# Rules use the EgressRule shape (src/drivers/openshell/policy.ts): name, host,
# ports, binaries. Bump `version` on ANY rule change.
name: crm
version: 1
description: HubSpot CRM REST API over HTTPS (api.hubapi.com), from node and bun only. Credentials still come from an OpenShell provider, never the agent.
rules:
  - name: crm_hubspot_api
    host: api.hubapi.com
    ports: [443]
    binaries: [/usr/local/bin/node, /usr/local/bin/bun]
